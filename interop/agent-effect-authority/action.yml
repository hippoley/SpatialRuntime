name: "Agent Effect Authority conformance"
description: "Verify effect-authority claims, semantic mappings, lifecycle correlation, or authoritative-effect evidence."
inputs:
  mode:
    description: "Verification mode: claim, mapping, mapping-v0.2, tool-decision-lifecycle, or effect-evidence-v0.2"
    required: true
  file:
    description: "Path to the claim, mapping, or effect observation JSON in the caller workspace"
    required: true
  policy:
    description: "Path to the trusted evidence registry/policy JSON for effect-evidence-v0.2"
    required: false
    default: ""
outputs:
  lifecycle_result:
    description: "PASS, UNRESOLVED, or FAIL for tool-decision-lifecycle mode"
    value: ${{ steps.verify.outputs.lifecycle_result }}
  unresolved_count:
    description: "Number of tool-decision records lacking safe correlation identity"
    value: ${{ steps.verify.outputs.unresolved_count }}
  error_count:
    description: "Number of lifecycle contradictions/errors"
    value: ${{ steps.verify.outputs.error_count }}
runs:
  using: "composite"
  steps:
    - name: Verify effect-authority artifact
      id: verify
      shell: bash
      env:
        AEA_MODE: ${{ inputs.mode }}
        AEA_FILE: ${{ inputs.file }}
        AEA_POLICY: ${{ inputs.policy }}
      run: |
        set -euo pipefail
        case "$AEA_MODE" in
          claim)
            python "$GITHUB_ACTION_PATH/verify_claim.py"               "$AEA_FILE"               --manifest "$GITHUB_ACTION_PATH/manifest.json"
            ;;
          mapping)
            python "$GITHUB_ACTION_PATH/verify_semantic_mapping.py" "$AEA_FILE"
            ;;
          mapping-v0.2)
            python "$GITHUB_ACTION_PATH/verify_semantic_mapping_v02.py" "$AEA_FILE"
            ;;
          tool-decision-lifecycle)
            python "$GITHUB_ACTION_PATH/../otel-tool-decision-lifecycle/verify.py" "$AEA_FILE" --github-output "$GITHUB_OUTPUT"
            ;;
          effect-evidence-v0.2)
            if [[ -z "$AEA_POLICY" ]]; then
              echo "policy input is required for effect-evidence-v0.2" >&2
              exit 2
            fi
            python "$GITHUB_ACTION_PATH/verify_effect_observation_v02.py"               "$AEA_FILE" "$AEA_POLICY"
            ;;
          *)
            echo "unsupported mode: $AEA_MODE" >&2
            exit 2
            ;;
        esac
