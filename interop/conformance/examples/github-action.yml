# Copy into .github/workflows/agent-conformance.yml.
# Smoke test only: exercises SpatialRuntime's bundled reference evaluator.
# This does NOT validate your own verifier or establish independent adoption.
name: agent-conformance-smoke

on:
  pull_request:
  push:

jobs:
  bundled-reference-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: bundle
        uses: hippoley/SpatialRuntime/interop/conformance@ce7cce687e623ed16f9c60db782bed05e9b117ba
        with:
          mode: effect-evidence-bundle
          report_path: artifacts/effect-evidence-conformance.json
      - name: Require passing reference vectors
        shell: bash
        run: |
          test "${{ steps.bundle.outputs.conformance_result }}" = "PASS"
          test "${{ steps.bundle.outputs.failed_count }}" = "0"
          test -f "${{ steps.bundle.outputs.report_path }}"
      - name: Preserve reference smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatialruntime-bundled-reference-smoke
          path: artifacts/effect-evidence-conformance.json
          if-no-files-found: warn
