[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialruntime"
version = "0.8.0"
description = "Evidence-preserving executable spatial runtime for AI agents, physics, safety, and real-world device control."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "hippoley"}]
dependencies = []

[project.scripts]
spatialruntime = "spatialruntime.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
