name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - name: Test
        run: pytest
      - name: Verify AEA claim via local action
        uses: ./interop/agent-effect-authority
        with:
          mode: claim
          file: interop/agent-effect-authority/claim.example.json
      - name: Verify Narada mapping via local action
        uses: ./interop/agent-effect-authority
        with:
          mode: mapping
          file: interop/agent-effect-authority/mappings/narada.v0.1.json
      - name: Verify Narada mapping v0.2 via local action
        uses: ./interop/agent-effect-authority
        with:
          mode: mapping-v0.2
          file: interop/agent-effect-authority/mappings/narada.v0.2.json
      - name: Verify LangGraph mapping v0.2 via local action
        uses: ./interop/agent-effect-authority
        with:
          mode: mapping-v0.2
          file: interop/agent-effect-authority/mappings/langgraph.v0.2.json
      - name: Verify correlated tool-decision lifecycle via local action
        id: lifecycle_positive
        uses: ./interop/agent-effect-authority
        with:
          mode: tool-decision-lifecycle
          file: interop/otel-tool-decision-lifecycle/fixtures/positive-path.otlp.json
      - name: Verify unresolved correlation stays non-fatal via local action
        id: lifecycle_unresolved
        uses: ./interop/agent-effect-authority
        with:
          mode: tool-decision-lifecycle
          file: interop/otel-tool-decision-lifecycle/fixtures/devplane-style-no-call-id.otlp.json
      - name: Assert lifecycle Action outputs
        run: |
          test "${{ steps.lifecycle_positive.outputs.lifecycle_result }}" = "PASS"
          test "${{ steps.lifecycle_positive.outputs.unresolved_count }}" = "0"
          test "${{ steps.lifecycle_positive.outputs.error_count }}" = "0"
          test "${{ steps.lifecycle_unresolved.outputs.lifecycle_result }}" = "UNRESOLVED"
          test "${{ steps.lifecycle_unresolved.outputs.unresolved_count }}" = "1"
          test "${{ steps.lifecycle_unresolved.outputs.error_count }}" = "0"
      - name: Verify per-call decision binding via local action
        id: binding_per_call
        uses: ./interop/agent-effect-authority
        with:
          mode: decision-execution-binding
          file: interop/decision-execution-binding/fixtures/per-call-pass.json
      - name: Verify standing decision binding via local action
        id: binding_standing
        uses: ./interop/agent-effect-authority
        with:
          mode: decision-execution-binding
          file: interop/decision-execution-binding/fixtures/standing-pass.json
      - name: Verify unchecked standing scope remains unresolved
        id: binding_unresolved
        uses: ./interop/agent-effect-authority
        with:
          mode: decision-execution-binding
          file: interop/decision-execution-binding/fixtures/standing-not-checked.json
      - name: Verify temporal decision binding via local action
        id: binding_v02
        uses: ./interop/agent-effect-authority
        with:
          mode: decision-execution-binding-v0.2
          file: interop/decision-execution-binding/fixtures/aap-approval-pass.json
      - name: Assert decision-execution binding Action outputs
        run: |
          test "${{ steps.binding_per_call.outputs.conformance_result }}" = "PASS"
          test "${{ steps.binding_per_call.outputs.unresolved_count }}" = "0"
          test "${{ steps.binding_per_call.outputs.error_count }}" = "0"
          test "${{ steps.binding_standing.outputs.conformance_result }}" = "PASS"
          test "${{ steps.binding_unresolved.outputs.conformance_result }}" = "UNRESOLVED"
          test "${{ steps.binding_unresolved.outputs.unresolved_count }}" = "1"
          test "${{ steps.binding_unresolved.outputs.error_count }}" = "0"
          test "${{ steps.binding_v02.outputs.conformance_result }}" = "PASS"
          test "${{ steps.binding_v02.outputs.unresolved_count }}" = "0"
          test "${{ steps.binding_v02.outputs.error_count }}" = "0"
          test "${{ steps.lifecycle_positive.outputs.conformance_result }}" = "PASS"
          test "${{ steps.lifecycle_positive.outputs.lifecycle_result }}" = "PASS"
      - name: Validate neutral conformance catalog
        run: python interop/conformance/verify_catalog.py
      - name: Verify external-results evidence registry
        run: python interop/external-results/verify_registry.py
      - name: Verify conformance release contract
        run: python interop/conformance/verify_release_contract.py
      - name: Verify neutral conformance Action entry point
        id: neutral_binding
        uses: ./interop/conformance
        with:
          mode: decision-execution-binding
          file: interop/decision-execution-binding/fixtures/standing-pass.json
      - name: Assert neutral conformance Action outputs
        run: |
          test "${{ steps.neutral_binding.outputs.conformance_result }}" = "PASS"
          test "${{ steps.neutral_binding.outputs.unresolved_count }}" = "0"
          test "${{ steps.neutral_binding.outputs.error_count }}" = "0"
      - name: Verify external verifier bundle via neutral action
        id: external_bundle
        uses: ./interop/conformance
        with:
          mode: effect-evidence-bundle
          adapter_command: python interop/agent-effect-authority/examples/reference_adapter.py
      - name: Assert external verifier bundle outputs
        run: |
          test "${{ steps.external_bundle.outputs.conformance_result }}" = "PASS"
          test "${{ steps.external_bundle.outputs.failed_count }}" = "0"
          test "${{ steps.external_bundle.outputs.passed_count }}" = "${{ steps.external_bundle.outputs.total_count }}"
          test "${{ steps.external_bundle.outputs.total_count }}" -ge "11"
      - name: Verify authoritative evidence v0.2 via local action
        uses: ./interop/agent-effect-authority
        with:
          mode: effect-evidence-v0.2
          file: interop/agent-effect-authority/examples/effect-observation.v0.2.json
          policy: interop/agent-effect-authority/examples/trusted-evidence-policy.v0.2.json
      - name: Verify authoritative evidence v0.2 via neutral action
        id: evidence_confirmed
        uses: ./interop/conformance
        with:
          mode: effect-evidence-v0.2
          file: interop/agent-effect-authority/examples/effect-observation.v0.2.json
          policy: interop/agent-effect-authority/examples/trusted-evidence-policy.v0.2.json
      - name: Verify stale evidence remains unresolved via neutral action
        id: evidence_unresolved
        uses: ./interop/conformance
        with:
          mode: effect-evidence-v0.2
          file: interop/agent-effect-authority/examples/effect-observation-unresolved.v0.2.json
          policy: interop/agent-effect-authority/examples/trusted-evidence-policy-unresolved.v0.2.json
      - name: Verify contradicted evidence fails neutral action
        id: evidence_contradicted
        continue-on-error: true
        uses: ./interop/conformance
        with:
          mode: effect-evidence-v0.2
          file: interop/agent-effect-authority/examples/effect-observation-contradicted.v0.2.json
          policy: interop/agent-effect-authority/examples/trusted-evidence-policy-contradicted.v0.2.json
      - name: Assert authoritative evidence result semantics
        run: |
          test "${{ steps.evidence_confirmed.outputs.conformance_result }}" = "PASS"
          test "${{ steps.evidence_unresolved.outputs.conformance_result }}" = "UNRESOLVED"
          test "${{ steps.evidence_contradicted.outcome }}" = "failure"
          test "${{ steps.evidence_contradicted.outputs.conformance_result }}" = "FAIL"
