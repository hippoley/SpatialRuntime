name: Conformance counterexample
description: Show a real trace or implementation shape that an existing SpatialRuntime verifier misclassifies.
title: "[counterexample] "
labels: []
body:
  - type: input
    id: source
    attributes:
      label: Pinned external source
      description: Repository plus immutable commit/release.
      placeholder: owner/repo@40-char-sha
    validations:
      required: true

  - type: input
    id: mode
    attributes:
      label: Affected mode/profile
    validations:
      required: true

  - type: textarea
    id: minimal_input
    attributes:
      label: Minimal reproducing evidence
      description: Provide or link the smallest trace/fixture that demonstrates the issue.
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Current SpatialRuntime result
      description: What does the current verifier report?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Why that result is unsafe or inaccurate
      description: Explain the semantic mismatch without assuming the external project adopted SpatialRuntime.
    validations:
      required: true

  - type: textarea
    id: nonclaims
    attributes:
      label: Non-claims
      description: Explicitly state any adoption, endorsement, compliance, or security claims that are not established.
    validations:
      required: true
